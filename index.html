<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前后端分离计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app-shell">
    <section class="calculator-card">
        <div class="title-row">
            <div>
                <p class="eyebrow">Java + Spring Boot</p>
                <h1>前后端分离计算器</h1>
            </div>
            <span id="serverStatus" class="status status-offline">后端未检测</span>
        </div>

        <div class="display-area">
            <label for="expression">表达式</label>
            <input id="expression" type="text" autocomplete="off" placeholder="例如：(1+2)*3" maxlength="200">
            <div id="result" class="result">0</div>
            <div id="message" class="message" aria-live="polite"></div>
        </div>

        <div class="keypad" aria-label="计算器按键">
            <button class="btn btn-muted" data-value="(">(</button>
            <button class="btn btn-muted" data-value=")">)</button>
            <button class="btn btn-danger" id="clearButton">C</button>
            <button class="btn btn-operator" data-value="/">÷</button>

            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn btn-operator" data-value="*">×</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn btn-operator" data-value="-">−</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn btn-operator" data-value="+">+</button>

            <button class="btn btn-wide" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn btn-equals" id="calculateButton">=</button>
        </div>
    </section>

    <section class="history-card">
        <div class="history-header">
            <div>
                <p class="eyebrow">SQLite Persistence</p>
                <h2>计算历史</h2>
            </div>
            <button id="clearHistoryButton" class="small-danger-button">清空全部</button>
        </div>
        <div id="historyList" class="history-list"></div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
